  astra:
    reset-to-default: false     # true + restart = this gem back to defaults
    cooldowns:
      dimensional-daggers: 90
      unbounded: 90           # the ghost-ride on a hit player
      astral-projection: 300  # on leaving the body
      astral-projection-return: 120   # on returning to it
      dimensional-drift: 45
      dimensional-drift-interrupted: 35   # the shorter one when the drift is cut short
      astral-void: 150        # shares Astral Projection's slot
    damage:
      dimensional-daggers: 1.45   # HP per dagger, 5 a salvo (7.25 if every one lands); the energy curve runs it 1.27 at energy 1 to 1.60 at 11
    passives:
      soul-capture: true      # souls taken from mobs you kill in melee
      soul-healing: true      # the auto-consume that saves you at low HP
                              # Phasing is not here - it is turned off with
                              # chance.phasing: 0
    radius:
      astral-void: 7          # who gets pulled into the void
      astral-void-darkness: 9.1   # how far the blindness carries
      dagger-hit: 1           # contact radius of an ORBITING dagger (a thrown one uses its own trace)
      projection-leash: 50    # how far the projection may stray from the body
    duration:
      daggers-salvo: 24.5     # how long the daggers orbit
      unbounded-ride: 10      # hard cap on the ghost ride
      astral-projection-max: 30   # hard cap on the projection itself - the ghost comes back at it
      drift: 5                # how long Dimensional Drift lasts
      drift-invisibility: 10  # the invisibility it leaves behind
      haunt-tag: 15           # how long a haunt disables the victim's gem
      dagger-tag: 10          # how long one dagger hit disables it
      dagger-throw-delay: 1   # the wait between one thrown dagger and the next.
                              # Without it a salvo empties as fast as you can
                              # click. 0 = no wait, the old behaviour.
    power:
      dagger-speed: 0.825     # blocks per tick a thrown dagger travels
    chance:
      phasing: 5              # PERCENT of incoming hits phased through

  # ██╗    ██╗███████╗ █████╗ ██╗     ████████╗██╗  ██╗
