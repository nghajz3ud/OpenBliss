  # ██║███╗██║██╔══╝  ██╔══██║██║        ██║   ██╔══██║
  # ╚███╔███╔╝███████╗██║  ██║███████╗   ██║   ██║  ██║
  #  ╚══╝╚══╝ ╚══════╝╚═╝  ╚═╝╚══════╝   ╚═╝   ╚═╝  ╚═╝
  wealth:
    reset-to-default: false     # true + restart = this gem back to defaults
    cooldowns:
      rich-rush: 420
      amplification: 420      # shares Rich Rush's slot
      item-lock: 200
      unfortunate: 200        # shares Item Lock's slot
    damage: {}                # Wealth has no damaging ability - its powers lock, drain and boost
    passives:
      hero-of-the-village: true   # HoV I at T1, II at T2
      luck: true                  # Luck I
      auto-fortune: true          # Fortune on pickaxes / axes / shovels
      auto-looting: true          # Looting on swords
      auto-mending: true          # Mending on every gear slot (T2)
      double-debris: true         # a second netherite scrap on every smelt
    duration:
      rich-rush: 180          # how long the Rich Rush buff runs
      amplification: 30       # how long allies keep the Amplification boost
      item-lock: 10           # how long the target cannot swap items
      unfortunate: 20         # how long their actions can fizzle
    radius:
      amplification: 2        # which allies the buff reaches
      item-lock: 2            # who gets locked
    chance:
      bonus-ore: 50           # PERCENT of ore breaks that pay double
      bonus-ore-rich-rush: 50 # a SECOND, independent roll that only happens during Rich Rush
      bonus-mob-rich-rush: 50 # during Rich Rush, the chance EACH stack a mob you killed drops is doubled
                              # (0 = off). Bliss items a mob was carrying are never copied.
      unfortunate-cancel: 25  # PERCENT of an Unfortunate victim's hits and actions that
                              # simply fizzle. The DURATION above says how long they suffer
                              # it; this says how hard. 0 = Unfortunate does nothing.
    power:
      experience-multiplier: 1.5  # XP the gem adds on top
      amplification-levels: 1     # LEVELS Amplification pushes an enchant past the stage cap
                                  # (Sharpness 5 -> 6 at 1). The Honored One's decree clamp
                                  # tolerates exactly this many, so both move together.
                                  # 0 = Amplification no longer raises enchants.

  # ███████╗██████╗ ███████╗███████╗██████╗
  # ██╔════╝██╔══██╗██╔════╝██╔════╝██╔══██╗
  # ███████╗██████╔╝█████╗  █████╗  ██║  ██║
  # ╚════██║██╔═══╝ ██╔══╝  ██╔══╝  ██║  ██║
  # ███████║██║     ███████╗███████╗██████╔╝
  # ╚══════╝╚═╝     ╚══════╝╚══════╝╚═════╝
  # HEADS UP: Speed ships in TWO versions and the keys below are split between
  # them. Everything except the two `legacy-` keys belongs to the REWORKED gem
  # and does nothing while the gem is in legacy mode; the two `legacy-` keys are
  # the reverse. Legacy mode is on when `/bliss config` -> Legacy Speed is set,
  # or when Progression-picks-gems is on and the server is at Progression 3 or
  # below. The legacy gem has no cooldown knobs at all.
  speed:
    reset-to-default: false     # true + restart = this gem back to defaults
    cooldowns:
      thunder-step: 15
      blur: 90                # starts only when the LAST of the charges is spent (see power.blur-charges)
      speed-storm: 20         # how long ONE storm charge takes to come back
    damage:
      blur: 1.4               # HP of the FIRST blur in a cycle; each later one adds damage.blur-stack on top
      blur-stack: 0.7         # HP each blur ADDS over the one before it in a cycle
      legacy-blur-strike: 0.3 # HP per strike of the LEGACY blur, 14 strikes a cycle = 4.2 HP (only while legacy Speed is on)
    passives:
      speed: true             # Speed I at T1, II at T2, while the gem is held (none while Dolphins Grace is up)
      dolphins-grace: true    # Dolphins Grace while in water - on the reworked gem it REPLACES the Speed effect
      auto-efficiency: true   # Efficiency III at T1, V at T2, on pickaxes / axes / shovels
      auto-soul-speed: true   # Soul Speed I at T1, III at T2, on boots
    duration:
      blur-prime: 5           # seconds to land the primed hit after the first one
      speed-storm: 5.5        # how long one storm stands
    radius:
      speed-storm: 6          # how far the storm reaches
      legacy-speed-storm: 5   # the same, for the legacy storm
    power:
      blur-charges: 4         # blurs per cycle before the long cooldown
      blur-clones: 3          # clones spawned per blur
      speed-storm-charges: 5  # storm charges held at once

  # ███████╗██╗██████╗ ███████╗
  # ██╔════╝██║██╔══██╗██╔════╝
  # █████╗  ██║██████╔╝█████╗
  # ██╔══╝  ██║██╔══██╗██╔══╝
  # ██║     ██║██║  ██║███████╗
  # ╚═╝     ╚═╝╚═╝  ╚═╝╚══════╝
  fire:
    reset-to-default: false     # true + restart = this gem back to defaults
    # THE BLAST vs ARMOUR. With this key absent the fireball and meteor follow the
    # "True Damage" switch in /bliss config like every other ability, which is
    # what you almost always want. Uncomment it to pin them either way on their
    # own: true = the victim's armour is cancelled out, so a PLAYER takes the
    # blast's number whatever they wear (mobs keep the raw number), false = the
    # victim's own armour decides. A blast is a real explosion, so "true" works
    # by raising the hit to cancel armour rather than bypassing it; fireball-cap
    # still has the last word.
    #true-damage: true
    cooldowns:
      fireball: 75
      meteor-shower: 75       # shares the fireball's slot
      crisp: 42               # starts after the 10-second burn ends
      cozy: 599
    damage:
      fireball: 0.6           # MULTIPLIER on the blast (an explosion's damage falls off with distance from it); the cap below is the ceiling
      fireball-cap: 7         # the MOST HP one fireball blast can deal (7 = 3.5 hearts); 0 = no cap.
                              # The FIREBALL only - the meteor shower is uncapped. Resistance and
                              # absorption still come off after this, so 6 hearts is the ceiling.
      meteor-shower: 0.3      # MULTIPLIER - same, per meteor, and no cap
      crisp: 0.08             # HP per burn tick, every half second, while standing in the Crisp (1.6 HP over the full 10 s, plus the fire itself)
    passives:
      fire-resistance: true   # Fire Resistance I while the gem is held
      auto-fire-aspect: false # Fire Aspect on every sword in the inventory
      auto-flame: true        # Flame on every bow in the inventory
    radius:
      crisp: 4                # who the Crisp actually burns
      crisp-ring: 5           # the flame ring drawn around it (visual only)
      crisp-blocks: 5         # how far out the ground is transformed
      cozy: 4                 # who the campfire heals
      fireball-self-boost: 2  # how close you must be to ride your own blast
    duration:
      cozy: 600               # how long the campfire stands
      crisp-burn: 10          # how long the ground stays lit
      fireball-self-immunity: 4   # your own blast cannot hurt you for this long
      fireball-charge: 50         # seconds from the first click to full power on plain ground
      fireball-charge-fast: 30    # the same on magma, obsidian or in lava
    power:
      meteor-count: 20        # meteors per shower
      fireball-max-power: 2   # highest charge level a fireball reaches. Blast force grows
                              # with power (4.5 at 1 up to 8.5 at 9, flat past that; the
                              # cap above still has the last word). The charge time is
                              # duration.fireball-charge whatever this is.
      meteor-push: 2.0        # downward shove on each meteor
    chance:
      flame-strike: 15        # PERCENT of melee hits that ignite

# ══════════════════════════════════════════════════════════════════════════════════════════════════
#
#  ███╗   ███╗██╗   ██╗████████╗██╗  ██╗██╗ ██████╗      ██████╗ ███████╗███╗   ███╗███████╗
#  ████╗ ████║╚██╗ ██╔╝╚══██╔══╝██║  ██║██║██╔════╝     ██╔════╝ ██╔════╝████╗ ████║██╔════╝
#  ██╔████╔██║ ╚████╔╝    ██║   ███████║██║██║          ██║  ███╗█████╗  ██╔████╔██║███████╗
#  ██║╚██╔╝██║  ╚██╔╝     ██║   ██╔══██║██║██║          ██║   ██║██╔══╝  ██║╚██╔╝██║╚════██║
#  ██║ ╚═╝ ██║   ██║      ██║   ██║  ██║██║╚██████╗     ╚██████╔╝███████╗██║ ╚═╝ ██║███████║
#  ╚═╝     ╚═╝   ╚═╝      ╚═╝   ╚═╝  ╚═╝╚═╝ ╚═════╝      ╚═════╝ ╚══════╝╚═╝     ╚═╝╚══════╝
#
# ══════════════════════════════════════════════════════════════════════════════════════════════════
#
# The two Mythic gems, laid out like the block above: every ability's COOLDOWN,
# then every ability's and passive's DAMAGE. Restart the server after editing.
#
# COOLDOWNS are in SECONDS. The Mythic gems have no energy curve and take no
# Dragon Egg halving - the number you write is the number you get. A charge
# ability (Bloodsaws, Hauling Strike) lists the time ONE charge takes to come
# back; spent charges return one after the other. 0 = no cooldown.
#
# DAMAGE is the HP the hit lands (2 HP = 1 heart) with True Damage on, or the hit
# before armour with it off. The Honored One's dial does not reach these gems.
# Where the effect is a multiplier on a hit or a
# cap on one, it says so. Passives have no cooldown, so they appear under
# DAMAGE only.
#
# Negative values are ignored. A key you delete comes back at its default on
# the next restart. The reset switches work exactly as above.
mythic-gems:
  reset-all-to-default: false   # true + restart = both mythic gems back to defaults

  # ██╗  ██╗███████╗██████╗ ███████╗████████╗██╗ ██████╗
  # ██║  ██║██╔════╝██╔══██╗██╔════╝╚══██╔══╝██║██╔════╝
  # ███████║█████╗  ██████╔╝█████╗     ██║   ██║██║
  # ██╔══██║██╔══╝  ██╔══██╗██╔══╝     ██║   ██║██║
  # ██║  ██║███████╗██║  ██║███████╗   ██║   ██║╚██████╗
  # ╚═╝  ╚═╝╚══════╝╚═╝  ╚═╝╚══════╝   ╚═╝   ╚═╝ ╚═════╝
  heretic:
    reset-to-default: false     # true + restart = this gem back to defaults
    # A blood saw that has bounced off a block deals HALF its damage for the
    # rest of its flight (it ricochets up to 3 times and forgets what it already
    # pierced on every bounce). false = a bounced saw hits as hard as a direct
    # one. Also on /bliss config -> Gems.
    ricochet-half: true
    cooldowns:
      bloodsaw: 5             # per saw (2 saws), returning one after the other
      blood-ritual: 45        # the right-click dive
      bloodlink: 40           # the fountain two quick saws raise
    damage:
      bloodsaw: 4.0           # HP per saw hit (a repeat hit within 2 s deals 70% of it, so both saws on one target = 6.8)
      blood-ritual: 2.93      # HP per dive strike BEFORE the dive-height bonus (up to x3 = 8.79)
      blood-ritual-cap: 9.0   # the MOST one dive strike can deal (0 = the dive deals nothing; to lift the cap set it high)
      bloodlink: 2.0          # MULTIPLIER on melee hits taken inside the fountain (half of them)
      bloodlinking: 1.0       # MULTIPLIER on the damage mirrored across a dive-link group
      auto-crit: 1.9          # PASSIVE - MULTIPLIER on 3 of every 4 melee hits with the gem in hand
      blood-hardening: 13.0   # PASSIVE - the MOST HP a single hit can take from the holder (0 = the holder is IMMUNE; to lift the cap set it high)

  #  █████╗ ██╗   ██╗██████╗  █████╗ ████████╗██╗   ██╗███████╗
  # ██╔══██╗██║   ██║██╔══██╗██╔══██╗╚══██╔══╝██║   ██║██╔════╝
  # ███████║██║   ██║██████╔╝███████║   ██║   ██║   ██║███████╗
  # ██╔══██║██║   ██║██╔══██╗██╔══██║   ██║   ██║   ██║╚════██║
  # ██║  ██║╚██████╔╝██║  ██║██║  ██║   ██║   ╚██████╔╝███████║
  # ╚═╝  ╚═╝ ╚═════╝ ╚═╝  ╚═╝╚═╝  ╚═╝   ╚═╝    ╚═════╝ ╚══════╝
  auratus:
    reset-to-default: false     # true + restart = this gem back to defaults
    # The silent 1-second wait on the next chain after one is handed back. It
    # stops the refund being farmed for the slam's forward throw. false = no
    # wait between chains at all. Also on /bliss config -> Gems.
    refund-lock: true
    legacy: false               # true = the OLD Auratus. false (default) = the rework:
                                #   - a chain is refunded unless it hooked an entity or its slam connected
                                #     (animals, bats, fish, armour stands, creative/spectator don't count);
                                #     silently, and the next chain is locked for 1 s after a refund
                                #   - damage the parry turns away heals you by that amount
                                #   - the parry texture's sparks scatter in a cloud instead of one tight knot
                                #   - a chain latched on any block below you slams on arrival - no need to
                                #     have been airborne, no minimum angle
                                #   - the forward throw only happens when the slam hits NOTHING; a slam that
                                #     connects keeps you planted on the ground
                                #   - THE FLAG POLE: with the whole gem full (both chains, dash, Angels Grasp) throw
                                #     a chain and parry within 2 s of each other. The pole picks its target: whoever
                                #     the chain is reeling, else any non-ally player within 60 blocks. They go up
                                #     the pole with two firework arms, drop fast (4 hearts), go back up and dangle
                                #     9 s. Nobody in range = EVERY ability goes on cooldown, all back to full at once
                                #   - the Angels Grasp cast no longer hangs a random nearby player
                                #   - the slam throws you where you look, 4x the old lunge (same lift)
                                #   - the slam sounds and scatters debris like a mace, with fireworks out of the ground
                                #   - a chain that snags on terrain while reeling you is refunded and drops you
                                #   - the Echoing Aegis window parries falls too (everything else already was)
                                #   - chains tear through cobwebs, like the blood saws
    cooldowns:
      hauling-strike: 10      # per chain (2 chains), returning one after the other
      venerated-perforators: 15   # the right-click dash; also opens the Echoing Aegis window
      angels-grasp: 25        # sneak + right-click
    damage:
      hauling-strike-latch: 1.73    # HP when the chain hooks a target
      angels-grasp: 7.51            # HP of the chain-down ground slam
      air-slam: 2.13                # HP of a chain-down slam while airborne, BEFORE the fall-height bonus (up to x3 = 6.39)
      echoing-aegis: 0.2            # MULTIPLIER on the blocked hit reflected back (its 2.0 floor and 4.0 cap scale with it)
      feathered-fall: 0.333         # PASSIVE - MULTIPLIER on fall damage taken (0.333 = a third)

# ============================================================================
# BlissPlugin configuration.
# (Boolean gameplay toggles live in state.yml and are controlled via /bliss config.)

villager-event:
  # NOTE: the village's location is NOT set here. It comes from
  # /blissevent compass set, which is what the compass, the spawn ring and the
  # beams all read. (Two coordinate keys used to sit here claiming otherwise;
  # nothing ever read them, so they are gone rather than left as decoration.)

  # The jukebox song the "Disc of the Wanderer" plays when put in a jukebox.
  # Your resource pack (sounds.json + .ogg) AND a datapack
  # (data/<namespace>/jukebox_song/<name>.json) must define this key.
  # If the key isn't registered, the disc still spawns but plays nothing.
  disc-song-key: "bliss:village_clue"

  # THE LAST RAID's size. Every wave's mob count is multiplied by this, so the
  # shape of a wave is unchanged - the same ratio of pillagers to ravagers to
  # undead - and only how many of them turn up moves.
  #   1.0  = the raid as designed (wave 8 is ~110 raiders)
  #   0.5  = half of every wave
  #   0.25 = a quarter
  # Clamped to 0.05 - 3.0, and every species keeps at least one member, so a
  # small number thins the raid rather than deleting ravagers from it. Read
  # fresh at the start of each wave — but the plugin never re-reads config.yml
  # while running, so an edit needs a RESTART to take effect, mid-raid or not.
  raid-mob-scale: 1.0

# Fixed restoration pedestal.
# Normally the pedestal location is set in-game with /bliss pedestal set and
# saved to the per-server pedestal.yml — which is LOST when you move to a new
# server. Enable this block to pin a FALLBACK location that travels with this
# config: when there is no saved pedestal, the plugin builds one here at
# startup. It is a fallback only — a location you have already set in-game
# always wins and is never overwritten.
#
# OFF by default, and deliberately: with it on, a fresh install builds a
# pedestal at whatever coordinates are written below, in your world, without
# asking. Set your own coords before enabling it.
#
# To capture your coords: set the pedestal once in-game (/bliss pedestal set),
# then run /bliss pedestal export and paste the printed values below.
#
# NOTE: 'world' must match a world that exists on the server, and x/y/z are the
# BEACON-CENTRE block (the same spot /bliss pedestal export prints). If any of
# x/y/z is missing the pedestal is NOT built.
fixed-pedestal:
  enabled: false
  world: world
  x: 112
  y: 74
  z: -74
