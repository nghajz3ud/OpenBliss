#  ████╗ ████║██╔══██╗██╔══██╗██╔════╝  ██╔══██╗╚██╗ ██╔╝  ██╔══██╗██║     ██╔═══██╗██╔═══██╗██╔══██╗
#  ██╔████╔██║███████║██║  ██║█████╗    ██████╔╝ ╚████╔╝   ██████╔╝██║     ██║   ██║██║   ██║██║  ██║
#  ██║╚██╔╝██║██╔══██║██║  ██║██╔══╝    ██╔══██╗  ╚██╔╝    ██╔══██╗██║     ██║   ██║██║   ██║██║  ██║
#  ██║ ╚═╝ ██║██║  ██║██████╔╝███████╗  ██████╔╝   ██║     ██████╔╝███████╗╚██████╔╝╚██████╔╝██████╔╝
#  ╚═╝     ╚═╝╚═╝  ╚═╝╚═════╝ ╚══════╝  ╚═════╝    ╚═╝     ╚═════╝ ╚══════╝ ╚═════╝  ╚═════╝ ╚═════╝
#
# ══════════════════════════════════════════════════════════════════════════════════════════════════
#                                  GEMS SMP  -  ABILITY TUNING
# ══════════════════════════════════════════════════════════════════════════════════════════════════
#
# One block per gem. Inside each: every ability's COOLDOWN, then every
# ability's DAMAGE. Restart the server after editing.
#
# COOLDOWNS are in SECONDS, at full energy, without a Dragon Egg. Every
# ability keeps its energy curve (lower energy = longer cooldown) and the
# Dragon Egg halving; they scale off the number you write. Doubling a value
# doubles the cooldown at every energy level. 0 = no cooldown.
#
# DAMAGE is the HP the ability lands (2 HP = 1 heart) with True Damage ON, the
# shipped state - see TRUE DAMAGE below for what the holder's energy and the
# Honored One's dial add on top. A few abilities are not a flat hit - they deal
# a percentage of the target's health, multiply a melee blow or ride a real
# explosion - so they are tuned as a MULTIPLIER instead (1.0 = as designed,
# 1.5 = +50%). Each one says so.
#
# Negative values are ignored. A key you delete comes back at its default on
# the next restart.
#
# ─ PASSIVES ───────────────────────────────────────────────────────────────
# Each gem has a `passives:` block of yes/no switches for the effects it
# hands its holder just for carrying it - potions and auto-enchants. Set one
# to false and that ONE passive stops; everything else about the gem, and
# every other gem, is untouched. Unset = on, so a config that predates these
# keys behaves exactly as it did.
#
#   gems:
#     speed:
#       passives:
#         dolphins-grace: false    # Speed keeps everything else
#
# A switched-off potion is not stripped, only no longer refreshed, so it
# lapses within about two seconds - that way it never takes a potion the
# player drank themselves, and the same goes for the strips: Speed only takes
# Dolphins Grace back off you while its own switch is ON.
#
# One key covers BOTH Speed modes - the reworked gem and the legacy one a
# server runs through Progression 1-3 with "Progression picks gems" on.
#
# NOT here, because they already have an off-switch of their own: Life's
# passive heal (health.passive-heal) and Unbreaking (power.unbreaking-level:
# 0), Astra's Phasing (chance.phasing: 0), and Strength's melee multipliers,
# where 1.0 already means "off".
#
# RESET SWITCHES: set `reset-all-to-default` (just below) or a gem's own
# `reset-to-default` to true and restart. Every value in that scope goes back
# to the default, and the switch flips itself back to false.
#
# ─ TRUE DAMAGE ──────────────────────────────────────────────────────────────────────────
# The /bliss config -> Gems switch, ON by default. With it ON every DAMAGE
# number below lands as written, on anyone: a naked player, a player in
# enchanted netherite and a mob all take the same. Armour points, toughness,
# Protection and Feather Falling have no say. Write 4 and the hit is 4 HP,
# two hearts.
#
# With it OFF the number is the hit BEFORE armour, like a sword's damage: the
# victim's real armour, toughness and Protection reduce it, so a Protection IV
# netherite player takes far less than a naked one (a few abilities always
# land as written either way: Blur, Speed Storm, Static Burst). The numbers
# below were tuned for ON; turned OFF they will feel weak and want raising.
#
# WHAT STILL APPLIES, in both modes, on top of the number:
#   * the holder's ENERGY scale: x0.875 at energy 1, x1.00 at 6, x1.10 at 11.
#     No-Energy mode pins everyone to x1.10; with energy restrictions OFF it is
#     x1.00 for all. Fire's Crisp and the mythic gems are never scaled.
#   * the Honored One's Nerf/Buff dial, on the base gems' actives only
#   * per-ability CAPS: fireball-cap, energy-beam-cap, blood-ritual-cap
#   * a raised SHIELD, against the Flux beam and Flux Ground
#   * Heretic's Blood Hardening, which caps anything landing on its holder
#   * Resistance, totems and absorption, as always
#
# MULTIPLIERS. A few keys are not HP: they scale a melee blow, deal a share of
# the target's health, or ride a real explosion whose damage falls off with
# distance. Those say MULTIPLIER, and 1.0 means "as designed". A few more are
# CAPS or defensive knobs and say so. Everything else is HP.
#
# NOTE on deleting keys: any key the plugin ships is written back on the next
# start if it is missing, so deleting one does not remove it, it restores it.
# `reset-to-default` likewise only puts the shipped values back.
gems:
  reset-all-to-default: false   # true + restart = every gem back to defaults

  # ███████╗████████╗██████╗ ███████╗███╗   ██╗ ██████╗ ████████╗██╗  ██╗
  # ██╔════╝╚══██╔══╝██╔══██╗██╔════╝████╗  ██║██╔════╝ ╚══██╔══╝██║  ██║
  # ███████╗   ██║   ██████╔╝█████╗  ██╔██╗ ██║██║  ███╗   ██║   ███████║
  # ╚════██║   ██║   ██╔══██╗██╔══╝  ██║╚██╗██║██║   ██║   ██║   ██╔══██║
  # ███████║   ██║   ██║  ██║███████╗██║ ╚████║╚██████╔╝   ██║   ██║  ██║
  # ╚══════╝   ╚═╝   ╚═╝  ╚═╝╚══════╝╚═╝  ╚═══╝ ╚═════╝    ╚═╝   ╚═╝  ╚═╝
  strength:
    reset-to-default: false     # true + restart = this gem back to defaults
    cooldowns:
      frailer: 240            # right-click a player: Weakness + they take more damage
      nullify: 240            # shares Frailer's cooldown slot
      chad-strength: 150      # solo and Group share this
      bounty-hunter: 300      # the off-hand double-right-click target hunt
    damage:
      chad-strength: 1.6      # MULTIPLIER on every 4th / 9th crit while active (1.6 = +60%)
      frailer: 1.2            # MULTIPLIER on all damage a Frailed player takes (1.2 = +20%)
      low-hp-bonus: 3.0       # TOP of the off-hand low-HP comeback table; the whole curve scales with it
    passives:
      strength: true          # Strength I while the gem is held (GemAuraTask)
      auto-sharpness: false   # Sharpness up to V on swords and axes
                              # the melee multipliers above are separate - a
                              # multiplier of 1.0 is already "off"
    duration:
      chad: 20                # how long Chad Strength's crit window runs
      frailer: 15             # how long a Frailed target stays frail
      nullify: 10             # how long Nullify keeps their effects stripped

  # ███████╗██╗     ██╗   ██╗██╗  ██╗
  # ██╔════╝██║     ██║   ██║╚██╗██╔╝
  # █████╗  ██║     ██║   ██║ ╚███╔╝
  # ██╔══╝  ██║     ██║   ██║ ██╔██╗
  # ██║     ███████╗╚██████╔╝██╔╝ ██╗
  # ╚═╝     ╚══════╝ ╚═════╝ ╚═╝  ╚═╝
  flux:
    reset-to-default: false     # true + restart = this gem back to defaults
    cooldowns:
      energy-beam: 30         # the left-click beam (T2)
      ground: 30              # the on-hit variant; shares the beam's slot
      kinetic-burst: 30
      kinetic-overdrive-pair: 300   # right-click a player (pair-up)
      kinetic-overdrive-solo: 75    # right-click air (solo)
    damage:
      energy-beam: 1          # MULTIPLIER on the beam's charge curve: a tier-0 tap is 4 HP x this; a charged shot is the target's max health x charge% x 5 x this (1.0 at 100% charge = 5x their max health)
      energy-beam-cap: 0      # the MOST HP one beam hit can deal (14 = 7 hearts); 0 = no cap
      ground: 1               # MULTIPLIER - the target's CURRENT health x charge% x this (1.0 at 100% charge = all of it, and it cannot go past a kill)
      kinetic-burst: 1.0      # MULTIPLIER - stored damage as a percentage of the target's health
    passives:
      tireless: true              # strips slowness / hunger / weakness above energy 5
      flow-state-mining: true     # Flow State Mining - breaking blocks builds Haste
                                  # (both halves: the counter and the Haste it grants)
      flow-state-movement: true   # Flow State Movement - the speed that builds as you move
    radius:
      kinetic-burst: 5        # blocks the shove reaches
      copper-teleport: 51     # furthest copper block you can jump to
    power:
      kinetic-burst-push: 2.0     # how hard the burst shoves
      static-burst-cap: 200       # most damage Static Burst can soak up and pay back on the counter
      charge-lost-on-damage: 100  # PERCENT of the banked charge a hit knocks out of you.
                                  # 100 = all of it; 0 = the original behaviour, where only
                                  # firing the beam ever empties the bank
    duration:
      kinetic-overdrive-pair: 27  # how long the paired overdrive runs
      kinetic-overdrive-solo: 30  # how long the solo one runs
      ground-freeze: 3            # how long the ground variant freezes its victim

  # ██╗     ██╗███████╗███████╗
  # ██║     ██║██╔════╝██╔════╝
  # ██║     ██║█████╗  █████╗
  # ██║     ██║██╔══╝  ██╔══╝
  # ███████╗██║██║     ███████╗
  # ╚══════╝╚═╝╚═╝     ╚══════╝
  life:
    reset-to-default: false     # true + restart = this gem back to defaults
    cooldowns:
      circle-of-life: 180
      heart-lock: 75
      heart-drainer: 75       # shares Heart Lock's cooldown slot
      vitality-vortex: 45
    damage:
      radiant-fist: 2.0       # MULTIPLIER on hits against undead at T2 (2.0 = double); T1 gets half the bonus
    passives:
      wither-immunity: true         # wither is stripped off the holder above energy 4
      golden-apple-absorption: true # Absorption II from a golden apple, V from an enchanted one
      # the passive heal and the Unbreaking already have their own off-switch:
      # health.passive-heal and power.unbreaking-level (0 = don't grant it)
    health:
      circle-caster: 10       # HP the Circle of Life grants its caster (2 HP = 1 heart)
      circle-ally: 4          # HP it grants each ally standing in it
      drain-solo: 4           # HP the Heart Drainer takes one-on-one (written positive, it subtracts)
      drain-group: 8          # HP it takes when it catches a group
      passive-heal: 1.0       # HP per passive regen tick
      heart-lock-min: 3       # HP the Heart Lock can never pin a target below (Skript floor, 1.5 hearts)
      heart-lock-max-taken: 5 # HP the lock may take off a target's normal max at most
                              # (0 = no cap: it locks at whatever health the hit landed on)
    power:
      unbreaking-level: 3     # level of the Unbreaking the gem keeps on your gear at TIER 2; tier 1 is capped at I (0 = don't grant it, either tier)
      circle-lifesteal-level: 2   # Regeneration LEVEL the Circle's lifesteal grants on a hit
                                  # inside it. 0 = no lifesteal at all, which is the single
                                  # biggest nerf available to the Circle.
      circle-repair-caster: 6     # durability a second the Circle mends on the caster's items
      circle-repair-ally: 3       # ...and on a trusted ally's armour
    duration:
      circle-of-life: 30      # SECONDS the Circle stands - the hearts, the repair and
                              # the lifesteal window all end with it
      circle-lifesteal-regen: 2   # seconds of Regeneration a lifesteal hit grants
      heart-lock: 15          # how long the Heart Lock holds a target's max health down
      heart-drain: 20         # how long a drain holds
      animal-attraction: 30   # how long animals keep following you
      animal-breeding: 180    # how long the breeding buff lasts
    radius:
      circle-of-life: 4       # BLOCKS the Circle reaches - who gets the hearts, and how
                              # close an opponent must be to feed the lifesteal
      animal-attraction: 9    # which animals notice you
      animal-breeding: 30     # how far the breed search looks

  # ██████╗ ██╗   ██╗███████╗███████╗
  # ██╔══██╗██║   ██║██╔════╝██╔════╝
  # ██████╔╝██║   ██║█████╗  █████╗
  # ██╔═══╝ ██║   ██║██╔══╝  ██╔══╝
  # ██║     ╚██████╔╝██║     ██║
  # ╚═╝      ╚═════╝ ╚═╝     ╚═╝
  puff:
    reset-to-default: false     # true + restart = this gem back to defaults
    cooldowns:
      dash: 40
      breezy-bash: 75
      double-jump: 5          # the wait after landing before the next jump
    damage:
      dash: 3.13              # HP dealt to everything the dash passes through
      double-jump-stomp: 1.11 # HP dealt to whatever is directly under the landing
      breezy-bash: 19.2       # the MOST fall damage a Breezy Bash slam can deal
    passives:
      auto-power: true        # Power on every bow in the inventory
      auto-punch: true        # Punch on every bow in the inventory
    speed:
      dash: 3.2               # forward launch speed of the dash (before the energy power scale) - lower = slower + shorter
    power:
      double-jump-up: 1.0       # MULTIPLIER on the jump's upward kick (the tier sets it: T1 0.4 / T2 0.6)
      double-jump-forward: 1.5  # MULTIPLIER on how far the arc carries you (T1 0.6 / T2 0.7 before it; 1.5 = half again as far)
      breezy-bash-launch: 2.6   # how hard the ON-HIT bash throws its single victim upward
      breezy-bash-group-up: 1.25   # the GROUP bash's upward throw
      breezy-bash-group-push: 2.5  # the GROUP bash's outward shove
      breezy-bash-grace: 3.0    # free metres before the slam's fall damage starts counting
    radius:
      breezy-bash: 5          # blocks the group bash sweeps
      dash-hit: 1.8           # how wide the dash's contact box is

  #  █████╗ ███████╗████████╗██████╗  █████╗
  # ██╔══██╗██╔════╝╚══██╔══╝██╔══██╗██╔══██╗
  # ███████║███████╗   ██║   ██████╔╝███████║
  # ██╔══██║╚════██║   ██║   ██╔══██╗██╔══██║
