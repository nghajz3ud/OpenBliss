name: BlissPlugin
version: 1.0.0
main: com.bliss.BlissPlugin
api-version: '1.21'
authors: [Blood, rar]
description: |
  Bliss SMP gameplay plugin. Java port and expansion of the original
  Bliss Skript by rar (used with permission — see credits/CREDITS.md
  and credits/permission.png inside the JAR for the full exchange).
load: POSTWORLD
softdepend: [Citizens, UltimateAdvancementAPI, WorldGuard]

commands:
  assessment:
    description: Admin command for the Assessment (Honored One) event.
    usage: /assessment <honoredone <set <player>|clear|status>|window <start|stop|status>|compass <juggernaut|player|all|clear> [player]|cage <set [radius]|clear|status>|ritual|day <1-11|next|status>|controlroom <set|clear|tp|status>>
    permission: bliss.admin
  blissevent:
    description: Admin command for the Villager Event.
    usage: /blissevent <phase <1|2|3>|end|compass set|villager <set|restock> <1|2|3>|give <token|soul <1|2|3>>>
    permission: bliss.admin
  bliss:
    description: Player guide (helpbook) plus admin tools for traders, upgraders, pedestals, progression, and player state.
    usage: /bliss <helpbook|admin helpbook|give|pedestal|setenergy|reroll|gemdisable|gemenable|reset|gemgem|cooldown|progression|config|menu|wisp|pocket <tp|kick> <player>|pov|dragongames>
  nick:
    description: Nick a player - a fake name and/or a borrowed skin, each set separately - and the memories roster.
    usage: /nick <name|skin|reset|memory> <player> [value]
    permission: bliss.admin
  goldendream:
    description: Everything Golden Dream - the memory world (menu, import, reset), the dreamers (skip, wake), the memories roster and NPC bots, and the nick.
    usage: /goldendream <config|progression <0-5|reset|status>|menu|import confirm|reset confirm|walk <start|stop|send> [player]|skip [player]|wake [player]|memory <add|remove|list|npc> ...|nick <name|skin|reset> <player> [value]>
    permission: bliss.admin
  gemswap:
    description: Answer a gem swap offer. Sent by right-clicking a player while holding a Trader; the ACCEPT/DECLINE buttons run this for you.
    usage: /gemswap <accept|decline> <token>
  alternate:
    description: Memories only - play the dream's cue where you stand. Two minutes between plays.
    usage: /alternate
  withdraw:
    description: Withdraw energy from your gem as Bottled Energy items.
    usage: /withdraw <1-9>
  recipe:
    description: View the crafting recipes for the custom Bliss items.
    usage: /recipe
  goldgem:
    description: Admin command for the Gold Gem — spawn it and manage the harvest victim list.
    usage: /goldgem <give [awakened] [player]|fragment <1-7|all|core> [player]|victim <add|remove|list> [player]|status>
    permission: bliss.admin
  victim:
    description: Gold Gem holder command — mark or unmark a player's soul for harvest.
    usage: /victim <add|remove> <player>
  trust:
    description: Trust / untrust another player so your gem abilities won't harm them.
    usage: /trust <add|remove> <player> | /trust <list|clear>
  pvp:
    description: Toggle PvP server-wide.
    usage: /pvp <on|off>
    permission: bliss.admin
  tasks:
    description: Award a Gold Gem arc task reward to the player who completed it.
    usage: /tasks wirefragment <1-7> claim <player> [reason...]
    permission: bliss.admin
  menu:
    description: Open the Bliss admin gem menu.
    usage: /menu
    permission: bliss.admin
  watts:
    description: Show your Flux watts and charge percent.
    usage: /watts
  hiddenwatts:
    description: Show your Flux hidden watts and charge percent.
    usage: /hiddenwatts
  maxwatts:
    description: Set your Flux watts to the maximum (2000000).
    usage: /maxwatts
    permission: bliss.admin
  resetwatts:
    description: Reset your Flux watts to zero.
    usage: /resetwatts
    permission: bliss.admin
  resetcharge:
    description: Reset every player's Flux beam charge to zero.
    usage: /resetcharge
    permission: bliss.admin
  setcharge:
    description: Set a player's Flux beam (action-bar) charge to a chosen amount.
    usage: /setcharge <player> <amount>
    permission: bliss.admin
  startcharging:
    description: Start draining your Flux charge percent into kinetic.
    usage: /startcharging
  stopcharging:
    description: Stop draining your Flux charge percent.
    usage: /stopcharging
  # ---- Dragon Games event; start/end/points are /bliss dragongames ----
  shop:
    description: Dragon Games shop — spend kill points (participants only).
    usage: /shop
    aliases: [dragonshop]   # /shop is a hot label - if another plugin grabs it first, this still works
  dragon:
    description: Dragon Egg holder — start the Dragon Games (once, ever).
    usage: /dragon games start
  # --- the mythic gems (merged in from the BlissMythics add-on) ----
  mythics:
    description: Open the Mythic Gems chest — click the Heretic or Auratus gem to receive one.
    usage: /mythics
    permission: bliss.admin
  juggernaut:
    description: Manage Juggernaut bindings (Heretic/Auratus) — set/remove/revive/unban/cinematic/spot/ritual/list.
    usage: /juggernaut <set|remove|revive|unban|cinematic|spot|ritual|kit <edit|save|cancel|reset>|list> ...
  cooldown:
    description: Admin — clear a player's Mythic gem ability cooldowns (Heretic / Auratus).
    usage: /cooldown <player>
    aliases: [cooldowns, mcd]

permissions:
  bliss.admin:
    description: Admin permissions for Bliss events.
    default: op
